name: registry

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR run is wasted CI; cancel it.
concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # verify-install scaffolds a real Next.js app; cap the job so a hung
    # prompt fails in minutes rather than burning the runner's full budget.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Matches pnpm-lock.yaml (lockfileVersion 9.0).
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Schema, duplicate names, include paths, missing files — one pass,
      # straight against the source. No build needed.
      - name: Validate registry
        run: pnpm registry:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Also emits public/r/*.json, which the install test serves.
      - name: Build
        run: pnpm build

      # The check that actually catches a missing registryDependencies entry:
      # install every item into a clean app that has none of our primitives,
      # then compile it.
      - name: Install every block into a clean app
        run: pnpm test:install
